name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # TypeScript type-check + Vite build
  # ─────────────────────────────────────────────
  build-check:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential python3

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run install scripts for native modules
        run: |
          npx node-gyp rebuild --directory node_modules/cpu-features || true
          node node_modules/ssh2/install.js || true

      - name: TypeScript check (renderer)
        run: npx tsc --noEmit

      - name: TypeScript check (electron)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build frontend (Vite)
        run: npm run build:ui

      - name: Build electron main process
        run: npm run build:electron

  # ─────────────────────────────────────────────
  # Dependency audit
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies (no native build needed for audit)
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        # Only fail on high/critical vulnerabilities; moderate ones often come from
        # transitive Electron/builder deps outside our control
        run: npm audit --audit-level=high
