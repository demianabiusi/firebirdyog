name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # TypeScript type-check + Vite build
  # ─────────────────────────────────────────────
  build-check:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # No --omit=optional: TypeScript 7 (native compiler) needs its
        # platform binary (@typescript/typescript-linux-x64), which is an
        # optional dependency.
        run: npm ci --ignore-scripts

      - name: TypeScript check (renderer)
        run: npx tsc --noEmit

      - name: TypeScript check (electron)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build frontend (Vite)
        run: npm run build:ui

      - name: Build electron main process
        run: npm run build:electron

  # ─────────────────────────────────────────────
  # Dependency audit
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        # Audit production dependencies (exclude dev tools like concurrently / build tools)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # ─────────────────────────────────────────────
  # Auto-bump version on push to main
  # ─────────────────────────────────────────────
  bump-version:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    needs: [build-check]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'chore(release):') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bump version based on Conventional Commits
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            COMMITS=$(git log -1 --pretty=format:"%s%n%b")
          else
            COMMITS=$(git log "${BEFORE}..HEAD" --pretty=format:"%s%n%b")
          fi

          if echo "$COMMITS" | grep -qE "BREAKING CHANGE|^[a-zA-Z]+(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          echo "Incrementando versión ($BUMP)..."
          npm version "$BUMP" --no-git-tag-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_VER=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore(release): v${NEW_VER} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
