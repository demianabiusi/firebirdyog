name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # TypeScript type-check + Vite build
  # ─────────────────────────────────────────────
  build-check:
    name: Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # --omit=optional skips Windows-only electron-builder deps
        # (electron-builder-squirrel-windows, electron-winstaller, etc.)
        # that are not in the Linux lockfile and not needed for tsc/vite
        run: npm ci --ignore-scripts --omit=optional

      - name: TypeScript check (renderer)
        run: npx tsc --noEmit

      - name: TypeScript check (electron)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build frontend (Vite)
        run: npm run build:ui

      - name: Build electron main process
        run: npm run build:electron

  # ─────────────────────────────────────────────
  # Dependency audit
  # ─────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --omit=optional

      - name: Audit dependencies
        run: npm audit --audit-level=high --omit=optional
